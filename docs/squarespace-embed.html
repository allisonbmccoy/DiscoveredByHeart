<iframe
  id="discovered-by-heart"
  src="https://allisonbmccoy.github.io/DiscoveredByHeart/?embed=1"
  title="Discovered by Heart research finder"
  allow="geolocation"
  style="width:100%;height:1200px;border:0;display:block;"
></iframe>
<script>
(() => {
  const frame = document.getElementById("discovered-by-heart");
  const appOrigin = "https://allisonbmccoy.github.io";
  window.addEventListener("message", (event) => {
    if (event.origin !== appOrigin || event.source !== frame.contentWindow) return;
    if (event.data?.type !== "discovered-by-heart:resize") return;
    const height = event.data.height;
    if (typeof height !== "number" || !Number.isFinite(height) || height <= 0) return;
    frame.style.height = Math.ceil(height) + "px";
  });
  const measure = () => frame.contentWindow.postMessage(
    { type: "discovered-by-heart:measure" }, appOrigin
  );
  frame.addEventListener("load", measure);
  measure();
})();
</script>

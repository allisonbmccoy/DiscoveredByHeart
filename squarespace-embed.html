<iframe
  id="discovered-by-heart"
  src="https://allisonbmccoy.github.io/DiscoveredByHeart/"
  title="Discovered by Heart — Find a Study"
  width="100%"
  height="1600"
  style="display: block; width: 100%; border: 0;"
  scrolling="no"
  allow="geolocation"
></iframe>
<script>
(() => {
  const frame = document.getElementById("discovered-by-heart");
  const origin = new URL(frame.src).origin;
  window.addEventListener("message", (event) => {
    if (event.origin !== origin || event.source !== frame.contentWindow) return;
    if (event.data?.type !== "discovered-by-heart:resize") return;
    const height = event.data.height;
    if (typeof height !== "number" || !Number.isFinite(height) || height <= 0) return;
    frame.style.height = `${Math.ceil(height)}px`;
  });
  function requestHeight() {
    frame.contentWindow.postMessage({ type: "discovered-by-heart:measure" }, origin);
  }
  frame.addEventListener("load", requestHeight);
  requestHeight();
})();
</script>
